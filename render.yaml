services:
  - type: web
    name: pulse-socials-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: pulse-socials-backend
    buildCommand: pnpm install --frozen-lockfile && cd apps/backend && pnpm run build
    startCommand: cd apps/backend && pnpm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://pulse-socials.onrender.com
      - key: PORT
        value: 3000
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: ENCRYPTION_KEY
        sync: false
      - key: BACKEND_SECRET
        sync: false
      - key: MONAD_NETWORK
        value: testnet
      - key: MONAD_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: MONAD_CHAIN_ID
        value: "10143"
      - key: MONAD_EXPLORER_URL
        value: https://testnet.monadexplorer.com
      - key: MONAD_EXPLORER_API_URL
        sync: false
      - key: MONAD_USDC_ADDRESS
        sync: false
      - key: MONAD_USDT_ADDRESS
        sync: false
      - key: AIRDROP_AMOUNT
        value: "1"
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: PUSHER_CLUSTER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: pulse56@gmail.com
      - key: BREVO_SENDER_NAME
        value: "Pulse"
      - key: GMAIL_USER
        value: pulse56@gmail.com
      - key: GMAIL_FROM
        value: "Pulse <pulse56@gmail.com>"
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false